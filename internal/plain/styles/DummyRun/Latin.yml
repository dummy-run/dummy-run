# Latin abbreviations trip up people who read slowly, and screen readers say them in different ways.
extends: substitution
message: "Try '%s' instead of '%s'."
link: https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/style-guides/a-to-z-style-guide/#eg-etc-and-ie
level: suggestion
ignorecase: true
nonword: true
swap:
  '\be\.g\.': for example
  '\bi\.e\.': that is
  '\betc\.': and so on
