{{ define "main" }}
<section class="not-found">
  {{ with resources.Get "brand/mascot/dummy.svg" }}
  <img class="not-found-mascot" src="{{ .RelPermalink }}" width="160" height="160" alt="The Dummy mascot, a crash-test dummy head with a target on its temple">
  {{ end }}
  <h1 class="u-title">There is no page at this address.</h1>
  <p>The persona would log this as a 404 and move on. You can start again at the <a href="/">home page</a>, pick a page from the <a href="/docs/">reference</a>, or <a href="{{ .Site.Params.repo }}/issues">open an issue</a> if a link brought you here.</p>
</section>
{{ end }}
