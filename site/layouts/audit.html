{{ define "main" }}
<div class="docs-layout is-single">
  <article class="prose">
    {{ partial "breadcrumbs.html" . }}
    <header class="page-header">
      <h1 class="u-title">{{ .Title }}</h1>
      {{ with .Params.lead }}<p class="u-lead">{{ . | markdownify }}</p>{{ end }}
    </header>
    {{ .Content }}
    {{ partial "audit-form.html" . }}
    {{ partial "page-source.html" . }}
  </article>
</div>
{{ end }}
