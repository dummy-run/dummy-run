{{ define "main" }}
<div class="docs-layout">
  <article class="prose">
    <header class="page-header">
      <h1 class="u-title">{{ .Title }}</h1>
      {{ with .Params.lead }}<p class="u-lead">{{ . | markdownify }}</p>{{ end }}
    </header>
    {{ .Content }}
    {{ partial "page-source.html" . }}
  </article>
  {{ partial "docs-nav.html" . }}
</div>
{{ end }}
