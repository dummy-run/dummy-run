{{- /* The free-scan waitlist form. Pass source (the page path) and prefix (ids, so a page can hold two forms). */ -}}
{{- $p := .prefix | default "waitlist" -}}
<form class="waitlist-form" method="post" action="{{ site.Params.waitlist_endpoint }}">
  <div class="field">
    <label for="{{ $p }}-email">Email address</label>
    <input id="{{ $p }}-email" name="email" type="email" autocomplete="email" required aria-describedby="{{ $p }}-status">
  </div>
  <div class="field">
    <label for="{{ $p }}-role">Your role <span class="field-hint">(optional)</span></label>
    <select id="{{ $p }}-role" name="role">
      <option value="">Prefer not to say</option>
      <option value="qa">QA or testing</option>
      <option value="accessibility">Accessibility</option>
      <option value="developer">Developer</option>
      <option value="product">Product or design</option>
      <option value="agency">Agency or consultancy</option>
      <option value="other">Something else</option>
    </select>
  </div>
  <div class="field">
    <label for="{{ $p }}-site">Site you would scan <span class="field-hint">(optional)</span></label>
    <input id="{{ $p }}-site" name="site_url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com">
  </div>
  <div class="field field-check">
    <input id="{{ $p }}-consent" name="consent" type="checkbox" value="yes" required>
    <label for="{{ $p }}-consent">I agree that Dummy Run may store my email address and these answers to tell me when the free scan opens. I can withdraw this at any time. <a href="/privacy/">Read how we use your data</a>.</label>
  </div>
  <input type="hidden" name="consent_version" value="2026-10-19-v1">
  <input type="hidden" name="source" value="{{ .source }}">
  {{- with site.Params.waitlist_turnstile_sitekey }}
  <div class="cf-turnstile" data-sitekey="{{ . }}" data-theme="auto"></div>
  {{- end }}
  <button class="btn" type="submit">{{ .button | default "Join the list" }}</button>
  <p id="{{ $p }}-status" class="waitlist-status" role="status" aria-live="polite" tabindex="-1"></p>
</form>
<noscript><p class="field-hint">Without JavaScript the form still works, and the human check may not show. If it does not, email hello@dummyrun.dev.</p></noscript>
