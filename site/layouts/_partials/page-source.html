{{- $repo := .Site.Params.repo -}}
{{- with .Params.source }}
<footer class="page-source">
  <p>Spotted a mistake? Suggest a change to <a href="{{ $repo }}/blob/main/{{ . }}"><code>{{ . }}</code></a> on GitHub.</p>
</footer>
{{- else }}
{{- with .File }}
<footer class="page-source">
  <p>Spotted a mistake? Suggest a change to <a href="{{ $repo }}/blob/main/site/content/{{ .Path }}"><code>site/content/{{ .Path }}</code></a> on GitHub.</p>
</footer>
{{- end }}
{{- end }}
