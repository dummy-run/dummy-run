baseURL = "https://dummyrun.dev/"
locale = "en-GB"
title = "Dummy Run"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]
timeout = "120s"

[params]
  description = "AI plays your users and tries your app before your customers do."
  repo = "https://github.com/dummy-run/dummy-run"

# The audit request form. It stays hidden, and nothing from the page reaches the API or Cloudflare
# Turnstile, when audit_form_enabled is off. The Worker at the endpoint is live, so it is on. The form uses
# waitlist_turnstile_sitekey for the human check. For a local build, override with
# HUGO_PARAMS_AUDIT_FORM_ENABLED=true. The endpoint must match connect-src and form-action in
# site/static/_headers. Change both together.
  audit_form_enabled = true
  audit_endpoint = "https://api.dummyrun.dev/audit-request"
  waitlist_turnstile_sitekey = "0x4AAAAAAFcGfkWTuKYNdB6G"

# The reference pages fall into these groups, in this order. A page joins a group with `group` in its
# front matter, or in the content adapter for pages rendered from the repository's Markdown.
[[params.docGroups]]
  key = "use"
  title = "Run it"
  text = "Install the engine, pick a model provider, write personas, and every command."
[[params.docGroups]]
  key = "understand"
  title = "How it is built"
  text = "What a run produces and the rules it follows."
[[params.docGroups]]
  key = "integrate"
  title = "Connect it"
  text = "Send runs to Grafana or any OpenTelemetry backend."
[[params.docGroups]]
  key = "project"
  title = "The project"
  text = "The plan, how to contribute, and how we write and design."
[[params.docGroups]]
  key = "policy"
  title = "Licence, trademarks and security"
  text = "What you may do with the code and the name, and how to report a problem."

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser.attribute]
  block = true

[markup.highlight]
  noClasses = false
  lineNos = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[sitemap]
  changefreq = "weekly"

[minify.tdewolff.html]
  keepEndTags = true
  keepQuotes = true
  keepDocumentTags = true
  keepComments = false

[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "../docs"
  target = "assets/repo/docs"
  files = ["/*.md", "/integrations/*.md", "/images/**"]
[[module.mounts]]
  source = "../CONTRIBUTING.md"
  target = "assets/repo/CONTRIBUTING.md"
[[module.mounts]]
  source = "../SECURITY.md"
  target = "assets/repo/SECURITY.md"
[[module.mounts]]
  source = "../TRADEMARKS.md"
  target = "assets/repo/TRADEMARKS.md"
[[module.mounts]]
  source = "../brand/README.md"
  target = "assets/repo/brand/README.md"
[[module.mounts]]
  source = "../brand/logo"
  target = "assets/brand/logo"
[[module.mounts]]
  source = "../brand/mascot"
  target = "assets/brand/mascot"
[[module.mounts]]
  source = "../casts/library"
  target = "assets/repo/casts/library"
  files = ["/*/profile.md", "/*/scenarios/*.md"]
[[module.mounts]]
  source = "../schema"
  target = "assets/repo/schema"
[[module.mounts]]
  source = "../examples/runs"
  target = "assets/repo/examples/runs"
[[module.mounts]]
  source = "../brand/logo/favicon.svg"
  target = "static/favicon.svg"
[[module.mounts]]
  source = "../brand/logo/favicon-32.png"
  target = "static/favicon-32.png"
[[module.mounts]]
  source = "../brand/logo/favicon-180.png"
  target = "static/apple-touch-icon.png"
[[module.mounts]]
  source = "../brand/logo/favicon-512.png"
  target = "static/icon-512.png"
[[module.mounts]]
  source = "../brand/logo/social-card.png"
  target = "static/social-card.png"
