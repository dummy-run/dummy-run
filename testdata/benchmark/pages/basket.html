<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your basket</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0; }
  a { color: #0b5394; }
  main { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ccc; }
  button { font: inherit; padding: .5rem 1rem; }
  :focus-visible { outline: 3px solid #0b5394; outline-offset: 2px; }
</style>
</head>
<body>
<header><nav aria-label="Main"><a href="/">Shop</a> <a href="/basket">Basket</a></nav></header>
<main>
  <h1>Your basket</h1>
  <table>
    <caption>Items in your basket</caption>
    <thead><tr><th scope="col">Item</th><th scope="col">Price</th><th scope="col">Remove</th></tr></thead>
    <tbody>
      <tr><td>Canvas tote bag</td><td>12.00</td><td><button type="button" aria-label="Remove Canvas tote bag">Remove</button></td></tr>
      <tr><td>Enamel mug</td><td>8.50</td><td><button type="button" aria-label="Remove Enamel mug">Remove</button></td></tr>
    </tbody>
  </table>
  <p>Total: 20.50</p>
  <p><label for="promo">Promo code</label> <input id="promo" name="promo" autocomplete="off"></p>
  <p><a href="/checkout" role="button">Go to checkout</a></p>
</main>
<footer><p><a href="/returns">Returns</a></p></footer>
</body>
</html>
