# Prometheus for the local stack. This is the otel-lgtm default plus a 30 day out of order window,
# so a seeder can write a history of runs through the OTLP receiver.
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.region
    - deployment.environment.name
    - host.name
storage:
  tsdb:
    out_of_order_time_window: 30d
