# Grafana-managed alert rules for Dummy Run, as a file provisioning document.
# Format: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Mount this directory as <GF_PATHS_PROVISIONING>/alerting. The data sources must exist with the UIDs
# below (prometheus, loki). integrations/grafana/stack/ and grafana/otel-lgtm both use those UIDs.
#
# Names come from docs/TELEMETRY.md after the OTLP translation. They were checked against the stack in
# integrations/grafana/stack/ fed by dummyrun-otel on 2026-10-18: every metric, label and structured
# metadata key below resolved.
#
# The two finding rules read Loki, because a finding log record carries the run's own time. The two
# Prometheus rules read counters, which carry the time the exporter sent them. A batch export of old runs
# makes those counters rise today, so the Prometheus rules are only meaningful with `dummyrun-otel watch`.
apiVersion: 1

groups:
  - orgId: 1
    name: dummyrun
    folder: Dummy Run
    interval: 1m
    rules:
      # 1. A confirmed permission finding: a persona saw or did something its role should not.
      # One alert per finding, with the run ID and the finding title in the summary.
      - uid: dummyrun-permission-confirmed
        title: Dummy Run confirmed a permission finding
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: |
                sum by (dummyrun_run_id, dummyrun_persona_id, dummyrun_target_environment, dummyrun_finding_id, dummyrun_finding_title) (
                  count_over_time({service_name="dummyrun"}
                    | dummyrun_finding_kind="permission"
                    | dummyrun_finding_verdict="confirmed" [15m])
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Run {{ $labels.dummyrun_run_id }} ({{ $labels.dummyrun_persona_id }} on {{ $labels.dummyrun_target_environment }}) confirmed a permission finding: {{ $labels.dummyrun_finding_title }}'
          description: 'Finding {{ $labels.dummyrun_finding_id }}. Open the run on the results board and check the screenshot before raising a ticket.'
        labels:
          dummyrun_kind: permission
          severity: high

      # 2. A blocker finding that the reviewer did not reject. Same shape as rule 1.
      - uid: dummyrun-blocker-finding
        title: Dummy Run found a blocker
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: |
                sum by (dummyrun_run_id, dummyrun_persona_id, dummyrun_target_environment, dummyrun_finding_id, dummyrun_finding_title) (
                  count_over_time({service_name="dummyrun"}
                    | dummyrun_finding_severity="blocker"
                    | dummyrun_finding_verdict!="rejected" [15m])
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Run {{ $labels.dummyrun_run_id }} ({{ $labels.dummyrun_persona_id }} on {{ $labels.dummyrun_target_environment }}) hit a blocker: {{ $labels.dummyrun_finding_title }}'
          description: 'Finding {{ $labels.dummyrun_finding_id }}. A blocker stopped the persona from doing its job. Check the step and screenshot on the results board.'
        labels:
          dummyrun_kind: blocker
          severity: high

      # 3. Too many runs ended blocked in one environment. A blocked run means the app stopped the persona.
      # Counters carry export time, so use this with `dummyrun-otel watch`.
      - uid: dummyrun-blocked-run-rate
        title: Dummy Run blocked-run rate is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Division by zero gives NaN, so an environment with no runs in the window does not alert.
              expr: |
                sum by (dummyrun_target_environment) (increase(dummyrun_runs_total{dummyrun_outcome="blocked"}[6h]))
                /
                sum by (dummyrun_target_environment) (increase(dummyrun_runs_total[6h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.25] }
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ humanizePercentage $values.A.Value }} of runs against {{ $labels.dummyrun_target_environment }} were blocked in the last 6 hours'
          description: 'Threshold is 25%. Compare the blocked runs on the dashboard to see whether one scenario or one persona accounts for them.'
        labels:
          dummyrun_kind: blocked-rate
          severity: medium

      # 4. Runs have stopped. Alerts when no run was exported in 24 hours, or when the metric is missing.
      # Counters carry export time, so use this with `dummyrun-otel watch`.
      # To watch one environment, add {dummyrun_target_environment="main"} to the selector.
      - uid: dummyrun-runs-stopped
        title: Dummy Run has not run for a day
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(dummyrun_runs_total[24h])) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 0s
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: 'No Dummy Run run has ended in the last 24 hours'
          description: 'Check the runner host and the exporter. If runs are not expected (for example a freeze), pause this rule.'
        labels:
          dummyrun_kind: runs-stopped
          severity: medium
