[files]
extend-exclude = ["*.png", "*.svg", "LICENSES/*", "LICENSE", "internal/page/axe/*", "internal/page/engines/*.js", "internal/page/engines/alfa/package-lock.json", "internal/page/consent/*"]

[default.extend-words]
# Firefox language group "x-beng" (Bengali) in internal/bidi/textscale.go
beng = "beng"
