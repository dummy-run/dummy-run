name: Release

# A v* tag builds, signs and publishes a release. docs/RELEASING.md is the checklist.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GORELEASER_VERSION: v2.18.3
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.55.0
  IMAGE: ghcr.io/dummy-run/dummyrun

jobs:
  release:
    name: Build, sign and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment is restricted to v* tags and holds the Homebrew token.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version and its commit is on main
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag such as v0.1.0"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release build never reads a cache that an earlier job could have written to.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Fix the build time at the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tap is off until the repository variable is true. See docs/RELEASING.md.
          HOMEBREW_TAP_ENABLED: ${{ vars.HOMEBREW_TAP_ENABLED }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: SLSA build provenance for the archives and the checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Collect the Linux binaries for the image
        run: |
          set -euo pipefail
          mkdir -p image-context/linux/amd64 image-context/linux/arm64
          cp dist/dummyrun_linux_amd64_v1/dummyrun image-context/linux/amd64/dummyrun
          cp dist/dummyrun_linux_arm64_v8.0/dummyrun image-context/linux/arm64/dummyrun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-context
          path: image-context
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build, test, sign and push the image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-context
          path: image-context
      - name: Image tags and build time
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags="${IMAGE}:${version}"
          # A release candidate or other pre-release does not move latest.
          if [[ "$version" != *-* ]]; then
            minor="${version%.*}"
            tags="${tags},${IMAGE}:${minor},${IMAGE}:latest"
          fi
          echo "IMAGE_TAGS=${tags}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image and smoke test it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dummyrun-smoke:ci
          provenance: false
          sbom: false
      - name: Smoke test
        run: scripts/smoke-image.sh dummyrun-smoke:ci
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push by digest with no tag. The digest gets its tags after it is signed and attested.
          # The attestations below replace BuildKit's own, which add manifests that some registries' tools mishandle.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the image by digest with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SLSA build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          syft-version: ${{ env.SYFT_VERSION }}
          format: spdx-json
          output-file: image.sbom.spdx.json
          upload-release-assets: false
      - name: SBOM attestation for the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.sbom.spdx.json
          push-to-registry: true

      - name: Give the signed digest its release tags
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

  publish:
    name: Publish the release
    needs: [release, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Take the release out of draft
        run: gh release edit "$TAG" --draft=false --verify-tag
