name: Exporter

on:
  push:
    branches: [main]
    paths:
      - integrations/grafana/exporter/**
      - .github/workflows/exporter.yml
  pull_request:
    paths:
      - integrations/grafana/exporter/**
      - .github/workflows/exporter.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/grafana/exporter

jobs:
  lint:
    name: Exporter passes golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/grafana/exporter/go.mod
          cache-dependency-path: integrations/grafana/exporter/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: integrations/grafana/exporter

  test:
    name: Exporter unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/grafana/exporter/go.mod
          cache-dependency-path: integrations/grafana/exporter/go.sum
      - name: Embedded schema matches the repository copy
        run: cmp internal/record/run-record.schema.json ../../../schema/run-record.schema.json
      - name: go vet
        run: go vet ./...
      - name: go test with the race detector and coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        # OIDC tokens are not issued to pull requests from forks, so those skip the upload.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: integrations/grafana/exporter/coverage.out
          flags: exporter
          disable_search: true
          fail_ci_if_error: false
      - name: Fuzz the run record parser for 30 seconds
        run: go test -run='^$' -fuzz=FuzzParseRunRecord -fuzztime=30s ./internal/record/
      - name: Dry run against the example records
        run: go run ./cmd/dummyrun-otel export --dry-run ../../../examples/runs > /dev/null

  e2e:
    name: Exporter end to end against grafana/otel-lgtm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/grafana/exporter/go.mod
          cache-dependency-path: integrations/grafana/exporter/go.sum
      - name: Pull grafana/otel-lgtm 0.35.0
        run: docker pull grafana/otel-lgtm@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
      - name: Export the examples and query Tempo, Loki, Prometheus and Grafana
        run: go test -tags e2e -count=1 -timeout 12m -v ./e2e/
