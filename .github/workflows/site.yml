name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "brand/**"
      - "schema/**"
      - "examples/runs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "TRADEMARKS.md"
      - "cmd/dummyrun/a11y.go"
      - "internal/a11y/**"
      - "internal/bidi/**"
      - "internal/tools/**"
      - "bin/check-start-session"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "brand/**"
      - "schema/**"
      - "examples/runs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "TRADEMARKS.md"
      - "cmd/dummyrun/a11y.go"
      - "internal/a11y/**"
      - "internal/bidi/**"
      - "internal/tools/**"
      - "bin/check-start-session"
      - ".github/workflows/site.yml"

permissions:
  contents: read

env:
  # The same pinned browsers as the Engine workflow's conformance job. Keep the two in step.
  CHROME_FOR_TESTING: 155.0.8059.12
  FIREFOX_VERSION: "157.0"

# A newer push cancels the run before it, so an older build can never deploy after a newer one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site builds and passes its checks
    runs-on: ubuntu-latest
    # Pull requests from forks are not built. They cannot reach the deploy job either.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Hugo 0.165.0 extended
        run: |
          set -euo pipefail
          curl -fsSLo hugo.tgz https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_extended_0.165.0_linux-amd64.tar.gz
          echo "f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20  hugo.tgz" | sha256sum -c -
          tar -xzf hugo.tgz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install the check tools
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: The start page terminal matches its capture
        run: bin/check-start-session
      - name: Social cards are up to date
        run: go run ./internal/tools/socialcards -check
      - name: Build
        working-directory: site
        run: hugo --gc --minify --panicOnWarning --printPathWarnings --printUnusedTemplates
      - name: HTML is valid
        working-directory: site
        run: npm run --silent check:html
      - name: Internal links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir "${{ github.workspace }}/site/public" --include-fragments --no-progress 'site/public/**/*.html'
          fail: true
      - name: Install Chrome for Testing and chromedriver
        env:
          VERSION: ${{ env.CHROME_FOR_TESTING }}
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/chrome-for-testing-public/${VERSION}/linux64"
          curl -fsSLo chrome.zip "${base}/chrome-linux64.zip"
          curl -fsSLo chromedriver.zip "${base}/chromedriver-linux64.zip"
          unzip -q chrome.zip -d "$HOME/cft"
          unzip -q chromedriver.zip -d "$HOME/cft"
          echo "DUMMYRUN_CHROME=$HOME/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "DUMMYRUN_CHROMEDRIVER=$HOME/cft/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
          "$HOME/cft/chrome-linux64/chrome" --version
          "$HOME/cft/chromedriver-linux64/chromedriver" --version
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ env.FIREFOX_VERSION }}
      - name: Firefox version
        run: |
          firefox --version
          echo "DUMMYRUN_FIREFOX=$(command -v firefox)" >> "$GITHUB_ENV"
      - name: Serve the built site
        working-directory: site
        run: |
          python3 -m http.server 1313 -d public --bind 127.0.0.1 &
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:1313/
      - name: Build the sweep
        run: go build -o "$RUNNER_TEMP/dummyrun" ./cmd/dummyrun
      - name: Documented commands that need the served site run
        run: go run ./internal/tools/doctest -site
      - name: Accessibility, Chrome, 1280 and 375 pixels, light and dark
        run: >-
          "$RUNNER_TEMP/dummyrun" a11y --browser chrome
          --sitemap http://127.0.0.1:1313/sitemap.xml --rebase http://127.0.0.1:1313
          --allow site/a11y-allow.txt --json "$RUNNER_TEMP/a11y-chrome.json"
          http://127.0.0.1:1313/404.html
      - name: Accessibility, Firefox, 1280 and 375 pixels, light and dark
        run: >-
          "$RUNNER_TEMP/dummyrun" a11y --browser firefox
          --sitemap http://127.0.0.1:1313/sitemap.xml --rebase http://127.0.0.1:1313
          --allow site/a11y-allow.txt --json "$RUNNER_TEMP/a11y-firefox.json"
          http://127.0.0.1:1313/404.html
      - name: Large text, Chrome, 320 pixels, 100 and 200 percent text, light and dark
        run: >-
          "$RUNNER_TEMP/dummyrun" a11y --browser chrome --viewport small --text-scale 100,200 --layout
          --sitemap http://127.0.0.1:1313/sitemap.xml --rebase http://127.0.0.1:1313
          --allow site/a11y-allow.txt --screenshots "$RUNNER_TEMP/large-text"
          --json "$RUNNER_TEMP/a11y-large-text.json"
          http://127.0.0.1:1313/404.html
      - name: No engine browser or profile directory is left behind
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/dummyrun" doctor'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: a11y-reports
          path: |
            ${{ runner.temp }}/a11y-*.json
            ${{ runner.temp }}/large-text
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/public
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dummyrun.dev
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/public
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
          command: pages deploy site/public --project-name=dummyrun --branch=main
