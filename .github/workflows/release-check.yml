name: Release check

# Proves the release setup builds, without publishing anything. The release itself is release.yml.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - docker/**
      - scripts/**
      - CHANGELOG.md
      - cmd/**
      - internal/**
      - integrations/grafana/exporter/**
      - go.mod
      - go.sum
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml
      - .github/workflows/engine.yml
  push:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - docker/**
      - scripts/**
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.3
  SYFT_VERSION: v1.55.0

jobs:
  goreleaser:
    name: GoReleaser config and snapshot build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Release notes script
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          test -n "$version"
          scripts/release-notes.sh "$version" > /dev/null
      - name: goreleaser check
        run: scripts/goreleaser-check.sh
      - name: Snapshot build of every target, with SBOMs
        env:
          HOMEBREW_TAP_ENABLED: "false"
        run: goreleaser release --snapshot --clean --skip=sign
      - name: The archives hold the licence files and the binaries report their version
        run: |
          set -euo pipefail
          tar -tzf dist/dummyrun_*_linux_amd64.tar.gz | sort
          tar -tzf dist/dummyrun_*_linux_amd64.tar.gz | grep -qx LICENSE
          tar -tzf dist/dummyrun_*_linux_amd64.tar.gz | grep -qx NOTICE
          tar -tzf dist/dummyrun_*_linux_amd64.tar.gz | grep -qx README.md
          dist/dummyrun_linux_amd64_v1/dummyrun version
          dist/dummyrun-otel_linux_amd64_v1/dummyrun-otel version
          test -s dist/checksums.txt
          ls dist/*.sbom.spdx.json
      - name: A second build gives the same checksums
        run: |
          set -euo pipefail
          cp dist/checksums.txt "$RUNNER_TEMP/first-checksums.txt"
          goreleaser release --snapshot --clean --skip=sign,sbom
          # The checksums file of the first build also lists SBOMs, so compare the binaries only.
          grep -v 'sbom' "$RUNNER_TEMP/first-checksums.txt" | diff - dist/checksums.txt
        env:
          HOMEBREW_TAP_ENABLED: "false"

  image:
    name: Image builds and passes the smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Browser versions in the Dockerfile match engine.yml
        run: |
          set -euo pipefail
          chrome=$(sed -n 's/^  CHROME_FOR_TESTING: *//p' .github/workflows/engine.yml)
          firefox=$(sed -n 's/^  FIREFOX_VERSION: *"\(.*\)"/\1/p' .github/workflows/engine.yml)
          grep -qx "ARG CHROME_FOR_TESTING=${chrome}" docker/Dockerfile
          grep -qx "ARG FIREFOX_VERSION=${firefox}" docker/Dockerfile
      - name: Build the Linux binary
        run: |
          set -euo pipefail
          mkdir -p image-context/linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o image-context/linux/amd64/dummyrun ./cmd/dummyrun
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: dummyrun-smoke:ci
          provenance: false
          sbom: false
      - name: Smoke test
        run: scripts/smoke-image.sh dummyrun-smoke:ci
      - name: Image size
        run: docker image ls dummyrun-smoke:ci
