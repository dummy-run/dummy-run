name: Mutation

# Gremlins changes the engine's code one small step at a time, such as > to >= or + to -, and runs the unit tests
# against each change. A change the tests still pass is a gap in the tests. It runs weekly and on demand, split
# between four jobs by package, and reports the counts without failing: CONTRIBUTING.md says how to read them.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gremlins:
    name: Unit tests catch code changes (part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Unleash the gremlins
        env:
          SHARD: ${{ matrix.shard }}
        run: bin/mutation mutation "$SHARD" 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation/
          if-no-files-found: ignore

  summary:
    name: Mutation summary
    needs: gremlins
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: mutation
      - name: Summarise
        run: python3 bin/mutation-summary --shards 4 mutation >> "$GITHUB_STEP_SUMMARY"
