version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      site-checks:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /integrations/grafana/exporter
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
