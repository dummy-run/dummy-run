name: Bug
description: Something in Dummy Run itself does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Command, run ID, log excerpt or screenshot. Redact anything from a target environment.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main @ abc1234
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options: [Laptop, GitHub Actions, Kubernetes (Helm), Google Cloud, Azure, Other]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real customer, company or person data and nothing copied from a target environment.
          required: true
